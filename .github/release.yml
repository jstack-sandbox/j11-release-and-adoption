# A release's notes, which GitHub generates from the pull requests merged
# since the last version, grouped by the labels the jstack workflow's
# type-label job sets from each title; a pull request goes in the first
# group whose label it carries.
changelog:
  categories:
    - title: Breaking changes
      labels: [breaking]
    - title: Features
      labels: [feat]
    - title: Fixes
      labels: [fix]
    - title: Other changes
      labels: ["*"]
